services:
  - type: web
    name: markdown-converter
    runtime: python
    buildCommand: bash backend/scripts/build.sh
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: MC_PDF_ENABLED
        value: "true"
      - key: OMP_NUM_THREADS
        value: "2"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
